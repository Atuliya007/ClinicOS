[tool.poetry]
package-mode = false
name = "clinicos-backend"
version = "0.1.0"
description = "Backend API for ClinicOS"
authors = ["Atuliya Bansal"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.1"
uvicorn = { extras = ["standard"], version = "^0.35.0" }

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.0"
pytest = "^8.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"